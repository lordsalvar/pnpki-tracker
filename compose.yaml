services:
    pnpki-tracker-app:
        build:
            context: '.'
            dockerfile: 'docker/8.5/Dockerfile'
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'pnpki-tracker-app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8280}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        restart: always
        networks:
            - sail
networks:
    sail:
        driver: bridge